# Session-wide defaults for graphical applications under sway.

# Disable DRM format modifiers so wlroots can recover outputs after DPMS.
# Without this, eDP-1 gets a "Swapchain failed test" error and stays black
# after screen blanking. Safe on Intel-only (i915) with no NVIDIA driver.
WLR_DRM_NO_MODIFIERS=1

QT_QPA_PLATFORM=wayland;xcb

# Uncomment only if a Mozilla app still prefers XWayland on this system.
# MOZ_ENABLE_WAYLAND=1